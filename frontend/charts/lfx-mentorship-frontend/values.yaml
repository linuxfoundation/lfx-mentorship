---
replicaCount: 2

image:
  repository: ghcr.io/linuxfoundation/lfx-mentorship-frontend
  pullPolicy: Always
  tag: "" # required — set per environment via ArgoCD values

imagePullSecrets: []

# Deployment-level annotations. Defaults to the Reloader trigger so a ConfigMap
# or Secret change restarts the pods; environments may add to or replace this.
annotations:
  reloader.stakater.com/auto: "true"

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false # Nuxt/Nitro writes tmp files at runtime
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ── Non-secret environment variables ────────────────────────────────────────
# Rendered into a ConfigMap and mounted via envFrom.
config:
  NODE_ENV: "production"
  NITRO_HOST: "0.0.0.0"
  NITRO_PORT: "3000"
  # Server-side base URL for the backend API. Required — see templates/validate.yaml.
  NUXT_API_BASE_URL: ""
  NUXT_PUBLIC_APP_ENV: "" # set per environment, e.g. development / production
  NUXT_PUBLIC_APP_URL: "" # set per environment, e.g. https://mentorship.dev.lfx.dev
  # Sitemap / site-config URL, normally identical to NUXT_PUBLIC_APP_URL. It has
  # to be set separately: setup/site.ts falls back to NUXT_PUBLIC_APP_URL only at
  # build time, and nuxt-site-config re-reads just this name at startup.
  NUXT_PUBLIC_SITE_URL: ""
  # NUXT_PUBLIC_SELF_SERVE_URL and NUXT_PUBLIC_CROWDFUNDING_URL are deliberately
  # absent rather than empty: an empty value overrides the image's baked-in
  # fallback with "", which turns the cross-service links in the header and on
  # the program page into same-origin paths this site does not serve. Set them
  # per environment instead — see values/{dev,staging,prod} in lfx-v2-argocd.
  #
  # NUXT_PUBLIC_INTERCOM_APP_ID is absent here for the same reason, and must be
  # set explicitly in production. The image is built with no NUXT_PUBLIC_* set,
  # so setup/runtime-config.ts derives intercomAppId from the build-time appEnv
  # ("development") and bakes the dev workspace id into the bundle; unlike the
  # URLs above it is not re-derived from NUXT_PUBLIC_APP_ENV at startup. An
  # empty value here would blank that baked id, leaving useIntercom() to reject
  # with "No Intercom app ID configured" in every non-production deployment.
  # templates/validate.yaml requires it when NUXT_PUBLIC_APP_ENV=production.

# ── Additional environment variables ─────────────────────────────────────────
# Rendered as a Kubernetes env: list on the Deployment. Supports the full env
# entry schema (value:, valueFrom:, etc.).
env: []

# ── Secret environment variables ─────────────────────────────────────────────
# Optional: the public site currently needs no secrets, so this is empty and
# no secretRef is mounted. Set it to a Secret name (managed by ESO) once the
# frontend gains credentials, e.g. an Auth0 client secret.
secretName: ""
