name: Mentorship Authorization Model Tests
model_file: model.fga
tuple_file: tuples.yaml

tests:
  - name: project-level program creation and approval rights
    check:
      - user: user:carla
        object: project:linux-foundation
        assertions:
          can_create_program: true
          can_approve_program: false
      - user: user:priya
        object: project:linux-foundation
        assertions:
          can_create_program: false
          can_approve_program: true
      - user: user:aisha
        object: project:linux-foundation
        assertions:
          can_create_program: true
          can_approve_program: true
      - user: user:miguel
        object: project:linux-foundation
        assertions:
          can_create_program: false

  - name: super_admin has unrestricted access to every project, program, application, and task
    check:
      - user: user:aisha
        object: project:linux-foundation
        assertions:
          can_create_program: true
          can_approve_program: true
      - user: user:aisha
        object: program:go-2026
        assertions:
          can_view: true
          can_invite_mentor: true
          can_create_term: true
          can_add_prerequisite_task: true
          can_view_applications: true
          can_decide_application: true
          can_approve: true
      - user: user:aisha
        object: program:rust-2026
        assertions:
          can_view: true
          can_approve: true
      - user: user:aisha
        object: application:app-mia
        assertions:
          can_view: true
          can_decide: true
      - user: user:aisha
        object: task:task-mia-1
        assertions:
          can_view: true
          can_update_status: true

  - name: program_admin has full control over the program they created
    check:
      - user: user:carla
        object: program:go-2026
        assertions:
          can_invite_mentor: true
          can_create_term: true
          can_add_prerequisite_task: true
          can_view_applications: true
          can_decide_application: true
          can_view: true
          can_approve: false

  - name: program_admin has no access to a program they do not administer
    check:
      - user: user:carla
        object: program:rust-2026
        assertions:
          can_view: false
          can_invite_mentor: false
          can_view_applications: false
          can_decide_application: false

  - name: mentor can view their program and applications but cannot manage or decide
    check:
      - user: user:miguel
        object: program:go-2026
        assertions:
          can_view: true
          can_view_applications: true
          can_approve: false
          can_create_term: true
          can_invite_mentor: false
          can_add_prerequisite_task: true
          can_decide_application: false

  - name: mentor has zero access to a program they were never invited to
    check:
      - user: user:miguel
        object: program:rust-2026
        assertions:
          can_view: false
          can_view_applications: false
          can_decide_application: false

  - name: mentee can view only their own application
    check:
      - user: user:mia
        object: application:app-mia
        assertions:
          can_view: true
          can_decide: false
      - user: user:mia
        object: application:app-noah
        assertions:
          can_view: false
          can_decide: false

  - name: program_admin and mentor can both decide applications
    check:
      - user: user:carla
        object: application:app-mia
        assertions:
          can_view: true
          can_decide: true
      - user: user:miguel
        object: application:app-mia
        assertions:
          can_view: true
          can_decide: true

  - name: mentee can view only tasks assigned to them, never another mentee's tasks
    check:
      - user: user:mia
        object: task:task-mia-1
        assertions:
          can_view: true
          can_update_status: true
      - user: user:noah
        object: task:task-mia-1
        assertions:
          can_view: false
          can_update_status: false

  - name: program_admin and mentor can view and update tasks in their program
    check:
      - user: user:carla
        object: task:task-mia-1
        assertions:
          can_view: true
          can_update_status: true
      - user: user:miguel
        object: task:task-mia-1
        assertions:
          can_view: true
          can_update_status: true

  - name: mentor can add both prerequisite and non-prerequisite tasks
    check:
      - user: user:miguel
        object: application:app-mia
        assertions:
          can_add_task: true
      - user: user:carla
        object: application:app-mia
        assertions:
          can_add_task: true
      - user: user:miguel
        object: program:go-2026
        assertions:
          can_add_task: true
          can_add_prerequisite_task: true
      - user: user:mia
        object: application:app-mia
        assertions:
          can_add_task: false

  - name: program_approver can view and approve, but cannot manage program operations
    check:
      - user: user:priya
        object: program:go-2026
        assertions:
          can_view: true
          can_approve: true
          can_invite_mentor: false
          can_create_term: false
          can_add_prerequisite_task: false
          can_view_applications: false
          can_decide_application: false
      - user: user:priya
        object: program:rust-2026
        assertions:
          can_view: true
          can_approve: true

  - name: program_approver can see applications (for review context) but cannot decide, and has no task-level access
    check:
      - user: user:priya
        object: application:app-mia
        assertions:
          can_view: true
          can_decide: false
      - user: user:priya
        object: task:task-mia-1
        assertions:
          can_view: false
          can_update_status: false
