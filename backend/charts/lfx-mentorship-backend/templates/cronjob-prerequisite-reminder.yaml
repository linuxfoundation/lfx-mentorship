{{- if .Values.prerequisiteReminderCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lfx-v2-mentorship-service.fullname" . }}-prerequisite-reminder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-mentorship-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: prerequisite-reminder
spec:
  schedule: {{ .Values.prerequisiteReminderCronJob.schedule | quote }}
  timeZone: {{ .Values.prerequisiteReminderCronJob.timeZone | quote }}
  concurrencyPolicy: {{ .Values.prerequisiteReminderCronJob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.prerequisiteReminderCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.prerequisiteReminderCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lfx-v2-mentorship-service.name" . }}
    spec:
      activeDeadlineSeconds: {{ .Values.prerequisiteReminderCronJob.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.prerequisiteReminderCronJob.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "lfx-v2-mentorship-service.name" . }}
            app.kubernetes.io/component: prerequisite-reminder
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "lfx-v2-mentorship-service.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: prerequisite-reminder
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.prerequisiteReminderCronJob.image.repository | default .Values.image.repository }}:{{ .Values.prerequisiteReminderCronJob.image.tag | default (required "image.tag is required" .Values.image.tag) }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/prerequisite-reminder"]
              {{- with .Values.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "lfx-v2-mentorship-service.fullname" . }}-config
                - secretRef:
                    name: {{ .Values.secretName }}
              resources:
                {{- toYaml .Values.prerequisiteReminderCronJob.resources | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.topologySpreadConstraints }}
          topologySpreadConstraints:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
