{{- if .Values.heimdall.addMiddleware }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "lfx-v2-mentorship-service.fullname" . }}-heimdall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-mentorship-service.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.heimdall.url | quote }}
    authResponseHeaders:
      - Authorization
{{- end }}