{{/*
Validation template — aborts helm install/upgrade when required values are missing.
No Kubernetes resource is rendered; this file only produces errors.
*/}}

{{- if not .Values.image.tag }}
{{- fail "\n\nvalues.yaml: image.tag is required.\nSet it to the image tag to deploy, e.g.:\n  image:\n    tag: \"abc1234\"" }}
{{- end }}

{{- if .Values.ingress.enabled }}
{{- fail "values.yaml: ingress.enabled is unsupported; Mentorship is served only through the shared Heimdall gateway." }}
{{- end }}

{{- if .Values.fundingStatsSyncCronJob.enabled }}
{{- if not .Values.config.LEDGER_BASE_URL }}
{{- fail "\n\nvalues.yaml: config.LEDGER_BASE_URL is required when fundingStatsSyncCronJob.enabled=true." }}
{{- end }}
{{- if not .Values.fundingStatsSyncCronJob.schedule }}
{{- fail "\n\nvalues.yaml: fundingStatsSyncCronJob.schedule is required when fundingStatsSyncCronJob.enabled=true." }}
{{- end }}
{{- if le (int .Values.fundingStatsSyncCronJob.activeDeadlineSeconds) 0 }}
{{- fail "\n\nvalues.yaml: fundingStatsSyncCronJob.activeDeadlineSeconds must be greater than 0 when fundingStatsSyncCronJob.enabled=true." }}
{{- end }}
{{- if lt (int .Values.fundingStatsSyncCronJob.backoffLimit) 0 }}
{{- fail "\n\nvalues.yaml: fundingStatsSyncCronJob.backoffLimit must be 0 or greater when fundingStatsSyncCronJob.enabled=true." }}
{{- end }}
{{- if not .Values.secretName }}
{{- fail "\n\nvalues.yaml: secretName is required when fundingStatsSyncCronJob.enabled=true (must include LEDGER_API_KEY and the RDS connection components; Ledger project_id values are mapped to mentorship programs by program ID)." }}
{{- end }}
{{- end }}

{{/*
Auth bypass guard.

DISABLED_MOCK_LOCAL_PRINCIPAL together with ALLOW_MOCK_LOCAL_PRINCIPAL_BYPASS
makes the service accept a static principal for every authenticated route with
no credentials at all. That is a local-development affordance only. Rendering
it into a real cluster would be a complete authentication bypass, so it is
refused unless allowLocalAuthBypass is explicitly set — which no environment
values file in lfx-v2-argocd sets, and none ever should.

Two things this guard must get right, both learned from review:

  - DISABLED_MOCK_LOCAL_PRINCIPAL is a principal *string*, not a boolean.
    internal/infrastructure/auth/jwt.go activates the mock path on any
    non-empty value, so testing for "true" would miss `localdev`.
  - Both .Values.config (rendered into the ConfigMap) and .Values.env
    (rendered as explicit container env on the Deployment and the migrate
    Job) reach the process, so both must be inspected.
*/}}
{{- $bypassKeys := list "DISABLED_MOCK_LOCAL_PRINCIPAL" "ALLOW_MOCK_LOCAL_PRINCIPAL_BYPASS" }}
{{- $bypassSet := false }}
{{- range $key := $bypassKeys }}
{{- if get $.Values.config $key }}
{{- $bypassSet = true }}
{{- end }}
{{- end }}
{{- range $entry := .Values.env }}
{{- if and (has $entry.name $bypassKeys) (or $entry.value $entry.valueFrom) }}
{{- $bypassSet = true }}
{{- end }}
{{- end }}
{{- if $bypassSet }}
{{- if ne (toString .Values.allowLocalAuthBypass) "true" }}
{{- fail "\n\nRefusing to render: the local auth bypass is enabled.\n\nDISABLED_MOCK_LOCAL_PRINCIPAL / ALLOW_MOCK_LOCAL_PRINCIPAL_BYPASS disable\nauthentication entirely and must never be set in a deployed environment.\nThis is checked in both config: and env:, and any non-empty principal counts.\n\nIf this really is a local kind/minikube cluster, opt in explicitly with:\n  --set allowLocalAuthBypass=true" }}
{{- end }}
{{- end }}

{{/*
Required runtime configuration. The binary exits at startup without these
(the database connection variables and MENTOR_INVITE_SECRET are hard-required;
the JWT settings fail when the authenticator is constructed), so catch it at
render time rather than in a crash-looping pod.

Skipped when the auth bypass is active: internal/infrastructure/auth/jwt.go
returns a mock-principal authenticator before parsing the Heimdall settings, so
requiring them would block the documented local bypass flow
(see make deploy-kind) for values the service never reads in that mode.
*/}}
{{- if not $bypassSet }}
{{- if le (int .Values.config.FGA_RELAY_MAX_ATTEMPTS) 0 }}
{{- fail "values.yaml: config.FGA_RELAY_MAX_ATTEMPTS must be greater than 0." }}
{{- end }}
{{- $heimdallJWKS := $.Values.config.HEIMDALL_JWKS_URL | default "" }}
{{- $heimdallAudience := $.Values.config.HEIMDALL_JWT_AUDIENCE | default "" }}
{{- $heimdallIssuer := $.Values.config.HEIMDALL_JWT_ISSUER | default "" }}
{{- range $key := list "HEIMDALL_JWKS_URL" "HEIMDALL_JWT_AUDIENCE" "HEIMDALL_JWT_ISSUER" }}
{{- if not (get $.Values.config $key) }}
{{- fail (printf "\n\nvalues.yaml: config.%s is required — the service fails to start without it.\nSet it per environment in the ArgoCD values file." $key) }}
{{- end }}
{{- end }}
{{- $heimdallConfigured := or $heimdallJWKS $heimdallAudience $heimdallIssuer }}
{{- if .Values.heimdall.enabled }}
{{- if not (and $heimdallJWKS $heimdallAudience $heimdallIssuer) }}
{{- fail "values.yaml: config.HEIMDALL_JWKS_URL, config.HEIMDALL_JWT_AUDIENCE, and config.HEIMDALL_JWT_ISSUER are required when heimdall.enabled=true." }}
{{- end }}
{{- if not $.Values.config.FGA_NATS_URL }}
{{- fail "values.yaml: config.FGA_NATS_URL is required when heimdall.enabled=true so authorization changes reach FGA." }}
{{- end }}
{{- if not $.Values.config.FGA_INDEXER_TOKEN_URL }}
{{- fail "values.yaml: config.FGA_INDEXER_TOKEN_URL is required when FGA_NATS_URL is configured." }}
{{- end }}
{{- if not $.Values.config.FGA_INDEXER_AUDIENCE }}
{{- fail "values.yaml: config.FGA_INDEXER_AUDIENCE is required when FGA_NATS_URL is configured." }}
{{- end }}
{{- end }}
{{- if $heimdallConfigured }}
{{- range $key := list "HEIMDALL_JWKS_URL" "HEIMDALL_JWT_AUDIENCE" "HEIMDALL_JWT_ISSUER" }}
{{- if not (get $.Values.config $key) }}
{{- fail (printf "\n\nvalues.yaml: config.%s must be set when Heimdall authentication is enabled. Set all three HEIMDALL_* values together." $key) }}
{{- end }}
{{- end }}

{{- if .Values.heimdall.enabled }}
{{- if not .Values.heimdall.addMiddleware }}
{{- fail "values.yaml: heimdall.enabled requires heimdall.addMiddleware=true" }}
{{- end }}
{{- if not .Values.openfga.enabled }}
{{- fail "values.yaml: heimdall.enabled requires openfga.enabled=true" }}
{{- end }}
{{- end }}
{{- if or .Values.heimdall.enabled .Values.heimdall.addMiddleware }}
{{- range $value := list .Values.lfx.domain .Values.traefik.gateway.name .Values.traefik.gateway.namespace .Values.heimdall.url }}
{{- if not $value }}
{{- fail "values.yaml: enabled Heimdall resources require lfx.domain, gateway name/namespace, and heimdall.url" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
