{{- if .Values.networkPolicy.enabled }}
{{- $gatewayNamespace := .Values.networkPolicy.gatewayNamespace | default .Values.traefik.gateway.namespace }}
{{- if not $gatewayNamespace }}
{{- fail "values.yaml: networkPolicy.enabled requires networkPolicy.gatewayNamespace or traefik.gateway.namespace" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lfx-v2-mentorship-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-mentorship-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lfx-v2-mentorship-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gatewayNamespace | quote }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
