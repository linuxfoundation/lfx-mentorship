{{- if .Values.fgaReconcileCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lfx-v2-mentorship-service.fullname" . }}-fga-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-mentorship-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: fga-reconcile
spec:
  schedule: {{ .Values.fgaReconcileCronJob.schedule | quote }}
  concurrencyPolicy: {{ .Values.fgaReconcileCronJob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.fgaReconcileCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.fgaReconcileCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lfx-v2-mentorship-service.name" . }}
    spec:
      activeDeadlineSeconds: {{ .Values.fgaReconcileCronJob.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.fgaReconcileCronJob.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "lfx-v2-mentorship-service.name" . }}
            app.kubernetes.io/component: fga-reconcile
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "lfx-v2-mentorship-service.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: fga-reconcile
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/fga-reconcile"]
              {{- with .Values.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "lfx-v2-mentorship-service.fullname" . }}-config
                - secretRef:
                    name: {{ .Values.secretName }}
              resources:
                {{- toYaml .Values.fgaReconcileCronJob.resources | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.topologySpreadConstraints }}
          topologySpreadConstraints:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}