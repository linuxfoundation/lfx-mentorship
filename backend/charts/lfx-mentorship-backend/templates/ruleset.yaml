              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:application-reviewer-fields
      allow_encoded_slashes: "off"
      match:
        methods: [GET, PUT]
        routes:
          - path: /mentorship/v1/applications/:id/note
          - path: /mentorship/v1/applications/:id/evaluation
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_application:{{ "{{- .Request.URL.Captures.id -}}" }}'
              relation: reviewer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:application-manager
      allow_encoded_slashes: "off"
      match:
        methods: [PATCH]
        routes:
