    - id: rule:lfx:lfx-mentorship-backend:application-delete
      allow_encoded_slashes: "off"
      match:
        methods: [DELETE]
        routes:
          - path: /mentorship/v1/applications/:id
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_application:{{ "{{- .Request.URL.Captures.id -}}" }}'
              relation: manager
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    # Task routes.
    - id: rule:lfx:lfx-mentorship-backend:tasks-auditor
      allow_encoded_slashes: "off"
      match:
