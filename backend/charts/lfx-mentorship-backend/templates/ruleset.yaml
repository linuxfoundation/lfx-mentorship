          - path: /mentorship/v1/programs/:id/members/:memberId
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_program:{{ "{{- .Request.URL.Captures.id -}}" }}'
              relation: writer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:program-terms-create
      allow_encoded_slashes: "off"
      match:
        methods: [POST]
        routes:
          - path: /mentorship/v1/programs/:id/terms
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_program:{{ "{{- .Request.URL.Captures.id -}}" }}'
              relation: writer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:nested-term-writer
      allow_encoded_slashes: "off"
      match:
        methods: [PATCH, DELETE, POST]
        routes:
          - path: /mentorship/v1/programs/:programID/terms/:termID
          - path: /mentorship/v1/programs/:programID/terms/:termID/close
          - path: /mentorship/v1/programs/:programID/terms/:termID/reopen
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_program:{{ "{{- .Request.URL.Captures.programID -}}" }}'
              relation: writer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:program-decision
      allow_encoded_slashes: "off"
      match:
        methods: [POST]
        routes:
          - path: /mentorship/v1/programs/:id/decision
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: mentorship_approver_team:global
              relation: member
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    # Nested term collections authorize against the parent program UID.
    - id: rule:lfx:lfx-mentorship-backend:term-manager-collections
      allow_encoded_slashes: "off"
      match:
        methods: [GET]
        routes:
          - path: /mentorship/v1/programs/:programID/terms/:id/applications
          - path: /mentorship/v1/programs/:programID/terms/:id/applications/export
          - path: /mentorship/v1/programs/:programID/terms/:id/past-mentees
          - path: /mentorship/v1/programs/:programID/terms/:id/tasks
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_program:{{ "{{- .Request.URL.Captures.programID -}}" }}'
              relation: manager
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:term-application-create
      allow_encoded_slashes: "off"
      match:
        methods: [POST]
        routes:
          - path: /mentorship/v1/programs/:programID/terms/:id/applications
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_program:{{ "{{- .Request.URL.Captures.programID -}}" }}'
              relation: viewer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:term-application-bulk-decline
      allow_encoded_slashes: "off"
      match:
        methods: [POST]
        routes:
          - path: /mentorship/v1/programs/:programID/terms/:id/applications/bulk-decline
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_program:{{ "{{- .Request.URL.Captures.programID -}}" }}'
              relation: writer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    # Application routes.
    - id: rule:lfx:lfx-mentorship-backend:applications-auditor
      allow_encoded_slashes: "off"
      match:
        methods: [GET]
        routes:
          - path: /mentorship/v1/applications/:id
          - path: /mentorship/v1/applications/:id/tasks
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_application:{{ "{{- .Request.URL.Captures.id -}}" }}'
              relation: auditor
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:applications-writer
      allow_encoded_slashes: "off"
      match:
        methods: [PATCH]
        routes:
          - path: /mentorship/v1/applications/:id
      execute:
        - authenticator: oidc
        - authorizer: openfga_check
          config:
            values:
              object: 'mentorship_application:{{ "{{- .Request.URL.Captures.id -}}" }}'
              relation: writer
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: rule:lfx:lfx-mentorship-backend:applications-mentee
      allow_encoded_slashes: "off"
      match:
        methods: [POST]
        routes:
          - path: /mentorship/v1/applications/:id/withdraw
          - path: /mentorship/v1/applications/:id/reapply
      execute:
