---
replicaCount: 2

image:
  repository: ghcr.io/linuxfoundation/lfx-mentorship-backend
  pullPolicy: Always
  tag: "" # required — set per environment via ArgoCD values

imagePullSecrets: []

# Deployment-level annotations. Defaults to the Reloader trigger so a ConfigMap
# or Secret change restarts the pods; environments may add to or replace this.
annotations:
  reloader.stakater.com/auto: "true"

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /livez
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ── Database migration hook ──────────────────────────────────────────────────
# Runs `/app/migrate` as a pre-install/pre-upgrade Job so schema changes land
# before the new application image starts serving traffic.
migrationJob:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Fail the release rather than hang if the DB is unreachable/misconfigured.
  activeDeadlineSeconds: 120
  backoffLimit: 2

# ── Non-secret environment variables ────────────────────────────────────────
# These are rendered into a ConfigMap and mounted via envFrom.
config:
  JWKS_URL: ""
  JWT_AUDIENCE: ""
  JWT_ISSUER: ""
  LEDGER_BASE_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "lfx-mentorship-backend"

# ── Additional environment variables ─────────────────────────────────────────
# Rendered as a Kubernetes env: list on the Deployment.
# Supports the full env entry schema (value:, valueFrom:, etc.).
# Override in ArgoCD values to inject secretKeyRef entries (e.g. DB components).
env: []

# ── Secret environment variables ─────────────────────────────────────────────
# These are sourced from a Kubernetes Secret via envFrom.secretRef.
# The Secret itself is managed externally (e.g. External Secrets Operator
# syncing from AWS Secrets Manager).
#
# Expected keys in the Secret:
#   The individual RDS components, referenced via env: above and mapped to
#   DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME:
#     host, port, username, password, dbname
#   The service assigns these to its pgx connection config directly rather than
#   assembling a DSN string, so a password containing a backslash or a space is
#   not altered in transit.
#   LEDGER_API_KEY — bearer token for Ledger service API
#   MENTOR_INVITE_SECRET — HMAC secret for signing mentor invite tokens.
#     Required: the service exits at startup if it is not set.
secretName: lfx-mentorship-backend-secrets

# allowLocalAuthBypass — opt-in, defaults to false.
#
# Permits config.DISABLED_MOCK_LOCAL_PRINCIPAL / ALLOW_MOCK_LOCAL_PRINCIPAL_BYPASS
# to be rendered. Those disable authentication entirely, so the chart refuses to
# render them unless this is explicitly true. For local kind/minikube only —
# never set it in an ArgoCD environment values file.
allowLocalAuthBypass: false

# createPlaceholderSecret — opt-in, defaults to false.
#
# When false (default): the Secret must already exist before helm install runs.
# When true: the chart creates an empty Secret placeholder via a pre-install hook
# for local development (kind/minikube). If ESO is also managing this Secret
# it MUST be configured with creationPolicy: Merge.
createPlaceholderSecret: false

# ── CronJob: program-funding-stats-sync ──────────────────────────────────────
# Runs hourly to sync mentorship credit totals from Ledger into program_funding_stats.
fundingStatsSyncCronJob:
  enabled: false
  schedule: "0 * * * *"
  # Maximum allowed runtime for each job execution.
  activeDeadlineSeconds: 3300
  # Maximum retries for a failed job before it is marked failed.
  backoffLimit: 1
  image:
    # Defaults to same repository and tag as the main API image.
    # Override only if building a separate image for the CronJob.
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
