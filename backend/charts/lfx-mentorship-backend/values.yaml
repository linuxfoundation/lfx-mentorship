---
replicaCount: 2

image:
  repository: ghcr.io/linuxfoundation/lfx-mentorship-backend
  pullPolicy: Always
  tag: "" # required — set per environment via ArgoCD values

imagePullSecrets: []

# Deployment-level annotations. Defaults to the Reloader trigger so a ConfigMap
# or Secret change restarts the pods; environments may add to or replace this.
annotations:
  reloader.stakater.com/auto: "true"

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Shared gateway integration ──────────────────────────────────────────────
# These remain disabled until the platform model, RuleSet, and environment
# values are approved together.
app:
  audience: lfx-mentorship-backend
  # Runs Heimdall's oidc_contextualizer on PUT /me and POST /me/program-memberships
  # so the JWT carries the caller's verified email (and name claims once the
  # platform emits them). The backend fills a new user's row from these on
  # sign-in; without it the row has no email or name. Each run is an IdP
  # userinfo call, rate-limited per user, so no other route runs it.
  use_oidc_contextualizer: true

lfx:
  domain: ""

traefik:
  gateway:
    name: ""
    namespace: ""

heimdall:
  enabled: false
  addMiddleware: false
  url: ""
  # Leave the logo upload's writer check to the backend (FileService.AuthorizeProgramLogoUpload),
  # which runs on every image from v0.1.13. Flip this only once every pod runs such an image:
  # the RuleSet applies at once, while pods roll, and an older pod does not check. Set it back
  # to false before rolling the image back.
  logoUploadServiceAuthz: false

openfga:
  enabled: false

# Gateway limits for the file upload routes. The cap sits above the 20 MB file
# ceiling to leave room for multipart boundaries and part headers.
uploads:
  maxRequestBodyBytes: 22020096
  timeout: 120s

# Opt-in: restricts backend ingress to the shared gateway so in-cluster callers cannot bypass the RuleSet.
networkPolicy:
  enabled: false
  # Namespace of the Traefik pods that forward gateway traffic; defaults to traefik.gateway.namespace.
  gatewayNamespace: ""
  # Extra NetworkPolicyPeer entries, e.g. the BFF or the /internal/metrics scraper.
  extraIngressFrom: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /livez
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ── Database migration hook ──────────────────────────────────────────────────
# Runs `/app/migrate` as a pre-install/pre-upgrade Job so schema changes land
# before the new application image starts serving traffic.
migrationJob:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Fail the release rather than hang if the DB is unreachable/misconfigured.
  activeDeadlineSeconds: 120
  backoffLimit: 2

# ── Approver team ────────────────────────────────────────────────────────────
# The LFIDs allowed to publish or reject programs. When enabled, a post-install/
# post-upgrade Job runs `/app/approver-admin sync` with this list, adding the
# missing members and removing any not listed, so this file is the record of the
# roster. Each LFID must already have signed in to Self Serve once, or the Job
# fails naming it. One-off changes use the same binary: see docs/api.md.
approverTeam:
  enabled: false
  members: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  activeDeadlineSeconds: 120
  backoffLimit: 1

# ── Non-secret environment variables ────────────────────────────────────────
# These are rendered into a ConfigMap and mounted via envFrom.
config:
  HEIMDALL_JWKS_URL: ""
  HEIMDALL_JWT_AUDIENCE: ""
  HEIMDALL_JWT_ISSUER: ""
  FGA_NATS_URL: ""
  FGA_RELAY_BATCH_SIZE: "50"
  FGA_RELAY_INTERVAL: "1s"
  FGA_RELAY_RETRY_DELAY: "1m"
  FGA_RELAY_MAX_ATTEMPTS: "10"
  # How long a program or application create waits for its creator's FGA
  # relation, so the client's next request passes the gateway; 0 disables, max 15s.
  FGA_ACCESS_WAIT_TIMEOUT: "10s"
  INDEX_RELAY_RETRY_DELAY: "1m"
  INDEX_RELAY_MAX_ATTEMPTS: "10"
  # Notification email goes out via lfx-v2-email-service whenever FGA_NATS_URL is set; these are then required.
  # Public Mentorship site, e.g. https://mentorship.lfx.linuxfoundation.org
  PUBLIC_SITE_URL: ""
  # LFX Self Serve, where management pages live, e.g. https://app.lfx.dev
  SELF_SERVE_URL: ""
  # LF staff inbox (a Google Group) sent every mentee acceptance, with the mentee's
  # country, and a copy of every other email, with the original recipient in the
  # subject; must also be in EMAIL_ALLOWED_RECIPIENTS when that is set.
  EMAIL_COPY_INBOX: ""
  # Comma-separated LF staff inboxes, each told about every program submitted for review.
  EMAIL_REVIEW_INBOX: ""
  # Comma-separated addresses that are the only ones to receive email; set while
  # testing on real data so real users get nothing. user+tag@ variants of a
  # listed address match too. Empty sends to everyone.
  EMAIL_ALLOWED_RECIPIENTS: ""
  LEDGER_BASE_URL: ""
  # Crowdfunding is reached through the LFX v2 gateway at
  # https://lfx-api.<domain>/crowdfunding; the transactions route is public.
  CROWDFUNDING_BASE_URL: ""
  # ── Object storage ─────────────────────────────────────────────────────────
  # One public (CDN-fronted) bucket for logos and one private bucket for task
  # submissions; an unset bucket disables its file routes. Credentials come from
  # IRSA when deployed. Static AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are for
  # the local nats-s3 sidecar only and belong in the Secret, never here.
  AWS_REGION: ""
  LOGOS_S3_BUCKET: ""
  # Empty means AWS S3. Local: http://localhost:5222 (nats-s3 sidecar).
  LOGOS_S3_ENDPOINT_URL: ""
  # "true" in local values only; deployed buckets are provisioned ahead of time.
  LOGOS_S3_CREATE_MISSING_BUCKET: "false"
  # Browser-reachable CDN base URL; required when LOGOS_S3_BUCKET is set.
  LOGOS_CDN_URL_PREFIX: ""
  ATTACHMENTS_S3_BUCKET: ""
  ATTACHMENTS_S3_ENDPOINT_URL: ""
  ATTACHMENTS_S3_CREATE_MISSING_BUCKET: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "lfx-mentorship-backend"

# ── Additional environment variables ─────────────────────────────────────────
# Rendered as a Kubernetes env: list on the Deployment.
# Supports the full env entry schema (value:, valueFrom:, etc.).
# Override in ArgoCD values to inject secretKeyRef entries (e.g. DB components).
env: []

# ── Secret environment variables ─────────────────────────────────────────────
# These are sourced from a Kubernetes Secret via envFrom.secretRef.
# The Secret itself is managed externally (e.g. External Secrets Operator
# syncing from AWS Secrets Manager).
#
# Expected keys in the Secret:
#   The individual RDS components, referenced via env: above and mapped to
#   DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME:
#     host, port, username, password, dbname
#   The service assigns these to its pgx connection config directly rather than
#   assembling a DSN string, so a password containing a backslash or a space is
#   not altered in transit.
#   LEDGER_API_KEY — bearer token for Ledger service API
#   INDEXER_SERVICE_TOKEN — service credential stamped on index messages.
#     Optional: without it the index relay idles and outbox rows stay pending.
#   MENTOR_INVITE_SECRET — HMAC secret for signing mentor invite tokens.
#     Required: the service exits at startup if it is not set.
secretName: lfx-mentorship-backend-secrets

# allowLocalAuthBypass — opt-in, defaults to false.
#
# Permits config.DISABLED_MOCK_LOCAL_PRINCIPAL / ALLOW_MOCK_LOCAL_PRINCIPAL_BYPASS
# to be rendered. Those disable authentication entirely, so the chart refuses to
# render them unless this is explicitly true. For local kind/minikube only —
# never set it in an ArgoCD environment values file.
allowLocalAuthBypass: false

# createPlaceholderSecret — opt-in, defaults to false.
#
# When false (default): the Secret must already exist before helm install runs.
# When true: the chart creates an empty Secret placeholder via a pre-install hook
# for local development (kind/minikube). If ESO is also managing this Secret
# it MUST be configured with creationPolicy: Merge.
createPlaceholderSecret: false

# ── CronJob: program-funding-stats-sync ──────────────────────────────────────
# Runs hourly to sync mentorship credit totals from Ledger into program_funding_stats.
fundingStatsSyncCronJob:
  enabled: false
  schedule: "0 * * * *"
  # Maximum allowed runtime for each job execution.
  activeDeadlineSeconds: 3300
  # Maximum retries for a failed job before it is marked failed.
  backoffLimit: 1
  image:
    # Defaults to same repository and tag as the main API image.
    # Override only if building a separate image for the CronJob.
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid

# ── CronJob: prerequisite-reminder ───────────────────────────────────────────
# Emails pending mentees the prerequisite tasks they have not submitted, on their
# reminder days. Sends through lfx-v2-email-service, so FGA_NATS_URL and
# SELF_SERVE_URL are required, and EMAIL_ALLOWED_RECIPIENTS applies as it does to
# the API. Reminder days are UTC calendar days and the job keeps no sent marker:
# run it once a day, and keep timeZone at UTC. A failed Job is never retried, since a
# crash part-way through sending would email those mentees again; the command retries
# its own failures from before it sends anything.
prerequisiteReminderCronJob:
  enabled: false
  # 14:30 UTC daily, the legacy remind-incomplete-prerequisite-tasks schedule.
  schedule: "30 14 * * *"
  timeZone: "Etc/UTC"
  activeDeadlineSeconds: 1800
  image:
    # Defaults to same repository and tag as the main API image.
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
